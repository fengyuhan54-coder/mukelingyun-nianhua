<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="550" viewBox="0 0 1280 550"><rect width="1280" height="550" fill="#FBF5E9"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="45" y="62" font-size="34" fill="#392E29" font-weight="700">从文化理解到个性创作</text><text x="45" y="101" font-size="19" fill="#706357" font-weight="400">主创作路径 + 可选体验；各功能也可单独进入</text><rect x="45" y="145" width="220" height="145" rx="12" fill="#FFFCF6" stroke="#DCCCB5"/><text x="63" y="180" font-size="20" fill="#A94435" font-weight="700">01</text><text x="63" y="220" font-size="26" fill="#392E29" font-weight="700">了解年画</text><text x="63" y="259" font-size="17" fill="#706357" font-weight="400">纹样、寓意与配色</text><text x="269" y="226" font-size="22" fill="#A94435" font-weight="400">→</text><rect x="287" y="145" width="220" height="145" rx="12" fill="#FFFCF6" stroke="#DCCCB5"/><text x="305" y="180" font-size="20" fill="#A94435" font-weight="700">02</text><text x="305" y="220" font-size="26" fill="#392E29" font-weight="700">表达需求</text><text x="305" y="259" font-size="17" fill="#706357" font-weight="400">文字或参考图片</text><text x="511" y="226" font-size="22" fill="#A94435" font-weight="400">→</text><rect x="529" y="145" width="220" height="145" rx="12" fill="#FFFCF6" stroke="#DCCCB5"/><text x="547" y="180" font-size="20" fill="#A94435" font-weight="700">03</text><text x="547" y="220" font-size="26" fill="#392E29" font-weight="700">辅助创作</text><text x="547" y="259" font-size="17" fill="#706357" font-weight="400">提示词与模型生成</text><text x="753" y="226" font-size="22" fill="#A94435" font-weight="400">→</text><rect x="771" y="145" width="220" height="145" rx="12" fill="#FFFCF6" stroke="#DCCCB5"/><text x="789" y="180" font-size="20" fill="#A94435" font-weight="700">04</text><text x="789" y="220" font-size="26" fill="#392E29" font-weight="700">检查修改</text><text x="789" y="259" font-size="17" fill="#706357" font-weight="400">预览结果与调整</text><text x="995" y="226" font-size="22" fill="#A94435" font-weight="400">→</text><rect x="1013" y="145" width="220" height="145" rx="12" fill="#FFFCF6" stroke="#DCCCB5"/><text x="1031" y="180" font-size="20" fill="#A94435" font-weight="700">05</text><text x="1031" y="220" font-size="26" fill="#392E29" font-weight="700">保存展示</text><text x="1031" y="259" font-size="17" fill="#706357" font-weight="400">作品归档与下载</text><path d="M640 290 L640 333" stroke="#B89864" stroke-width="2" fill="none"/><path d="M237 333 L1043 333" stroke="#B89864" stroke-width="2" fill="none"/><path d="M237 333 L237 360" stroke="#B89864" stroke-width="2" fill="none"/><rect x="45" y="360" width="382" height="102" rx="12" fill="#F2E8D6" stroke="#DCCCB5"/><text x="63" y="400" font-size="24" fill="#85362D" font-weight="700">年画变装</text><text x="63" y="436" font-size="17" fill="#392E29" font-weight="400">人物照片 + 年画参考 → 风格化肖像</text><path d="M640 333 L640 360" stroke="#B89864" stroke-width="2" fill="none"/><rect x="448" y="360" width="382" height="102" rx="12" fill="#F2E8D6" stroke="#DCCCB5"/><text x="466" y="400" font-size="24" fill="#85362D" font-weight="700">墨痕留印</text><text x="466" y="436" font-size="17" fill="#392E29" font-weight="400">色彩分层 → 拖拽 / 逐层套印</text><path d="M1043 333 L1043 360" stroke="#B89864" stroke-width="2" fill="none"/><rect x="851" y="360" width="382" height="102" rx="12" fill="#F2E8D6" stroke="#DCCCB5"/><text x="869" y="400" font-size="24" fill="#85362D" font-weight="700">光影新生</text><text x="869" y="436" font-size="17" fill="#392E29" font-weight="400">动态要求 → 异步视频任务 → 保存</text><text x="45" y="512" font-size="20" fill="#706357" font-weight="400">灵伴相随与工作台贯穿功能入口、文化问答和任务衔接。</text></g></svg>