<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880"><rect width="1280" height="880" fill="#FBF5E9"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="45" y="62" font-size="34" fill="#392E29" font-weight="700">技术架构</text><text x="45" y="101" font-size="19" fill="#706357" font-weight="400">本地 Web 应用 · 服务端模型转发 · 用户自行配置密钥</text><rect x="45" y="140" width="1190" height="128" rx="12" fill="#FFFCF6" stroke="#DCCCB5"/><rect x="45" y="140" width="125" height="128" rx="12" fill="#EBD4CC" stroke="#EBD4CC"/><text x="72" y="213" font-size="26" fill="#392E29" font-weight="700">交互层</text><text x="195" y="186" font-size="23" fill="#392E29" font-weight="700">Web 页面</text><text x="195" y="227" font-size="17" fill="#706357" font-weight="400">Next.js 14 · React 18 · TypeScript</text><text x="535" y="186" font-size="23" fill="#392E29" font-weight="700">图像与工艺</text><text x="535" y="227" font-size="17" fill="#706357" font-weight="400">Canvas · 分层 · 透明度合成</text><text x="875" y="186" font-size="23" fill="#392E29" font-weight="700">三维与语音</text><text x="875" y="227" font-size="17" fill="#706357" font-weight="400">Three.js / GLB · 浏览器语音</text><text x="627" y="286" font-size="20" fill="#A94435" font-weight="400">↓</text><rect x="45" y="286" width="1190" height="128" rx="12" fill="#FFFCF6" stroke="#DCCCB5"/><rect x="45" y="286" width="125" height="128" rx="12" fill="#E8EBD9" stroke="#E8EBD9"/><text x="72" y="359" font-size="26" fill="#392E29" font-weight="700">编排层</text><text x="195" y="332" font-size="23" fill="#392E29" font-weight="700">任务路由</text><text x="195" y="373" font-size="17" fill="#706357" font-weight="400">关键词规则 · Skill 分发</text><text x="535" y="332" font-size="23" fill="#392E29" font-weight="700">创作流程</text><text x="535" y="373" font-size="17" fill="#706357" font-weight="400">规划 → 检索 → 生成 → 检查</text><text x="875" y="332" font-size="23" fill="#392E29" font-weight="700">状态反馈</text><text x="875" y="373" font-size="17" fill="#706357" font-weight="400">流式事件 · 上下文与版本</text><text x="627" y="432" font-size="20" fill="#A94435" font-weight="400">↓</text><rect x="45" y="432" width="1190" height="128" rx="12" fill="#FFFCF6" stroke="#DCCCB5"/><rect x="45" y="432" width="125" height="128" rx="12" fill="#F0E0C1" stroke="#F0E0C1"/><text x="72" y="505" font-size="26" fill="#392E29" font-weight="700">服务层</text><text x="195" y="478" font-size="23" fill="#392E29" font-weight="700">HTTP / API</text><text x="195" y="519" font-size="17" fill="#706357" font-weight="400">Next.js Route Handlers</text><text x="535" y="478" font-size="23" fill="#392E29" font-weight="700">AI 能力</text><text x="535" y="519" font-size="17" fill="#706357" font-weight="400">火山方舟 · 生图 / 视觉 / 对话</text><text x="875" y="478" font-size="23" fill="#392E29" font-weight="700">扩展服务</text><text x="875" y="519" font-size="17" fill="#706357" font-weight="400">阿里云百炼视频 · 高德地图</text><text x="627" y="578" font-size="20" fill="#A94435" font-weight="400">↓</text><rect x="45" y="578" width="1190" height="128" rx="12" fill="#FFFCF6" stroke="#DCCCB5"/><rect x="45" y="578" width="125" height="128" rx="12" fill="#DEDCEB" stroke="#DEDCEB"/><text x="72" y="651" font-size="26" fill="#392E29" font-weight="700">数据层</text><text x="195" y="624" font-size="23" fill="#392E29" font-weight="700">文化资源</text><text x="195" y="665" font-size="17" fill="#706357" font-weight="400">纹样库 · 传统配色 · 提示词</text><text x="535" y="624" font-size="23" fill="#392E29" font-weight="700">浏览器数据</text><text x="535" y="665" font-size="17" fill="#706357" font-weight="400">IndexedDB · localStorage</text><text x="875" y="624" font-size="23" fill="#392E29" font-weight="700">资源与记录</text><text x="875" y="665" font-size="17" fill="#706357" font-weight="400">静态图 / 视频 / GLB · PG 接口</text><rect x="45" y="748" width="1190" height="98" rx="12" fill="#852E29" stroke="#852E29"/><text x="70" y="788" font-size="22" fill="#FFF8EC" font-weight="700">密钥隔离</text><text x="220" y="788" font-size="19" fill="#FFF8EC" font-weight="400">火山方舟按浏览器会话配置；动效与地图由用户自行填写。</text><text x="70" y="823" font-size="17" fill="#EAD7BF" font-weight="400">仓库不包含真实密钥；模型生成需要对应服务权限，地图与语音受服务和浏览器支持限制。</text></g></svg>